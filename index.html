<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tableau des Commandes VO · Plaque EP</title>
<meta name="theme-color" content="#0e1a2b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e1a2b'/%3E%3Cpath d='M22 16h-3a4 4 0 0 0-4 4v28a4 4 0 0 0 4 4h26a4 4 0 0 0 4-4V20a4 4 0 0 0-4-4h-3M24 12h16v8H24zM24 32h16M24 40h10' stroke='%23fff' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f3f5f8;--panel:#fff;--ink:#0e1a2b;--ink2:#2b3a52;--muted:#6a7588;--line:#e2e7ee;--line2:#eef1f5;
  --accent:#0b5cff;--accent-soft:#e8f0ff;--accent-ink:#0a3fb0;--slate:#4a6481;
  --pos:#0c8a4f;--pos-soft:#e4f5ec;--neg:#d0302a;--neg-soft:#fdecea;--warn:#b97700;--warn-soft:#fff4dc;
  --f-ui:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--f-d:'Archivo',var(--f-ui);
  --r:10px;--shadow:0 1px 2px rgba(14,26,43,.06),0 4px 14px rgba(14,26,43,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13.5px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{width:1600px;margin:0 auto;padding:18px 24px 60px}
body.narrow .wrap{width:auto;padding:12px}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:42px;height:42px;border-radius:11px;background:var(--ink);display:grid;place-items:center}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand h1{font-family:var(--f-d);font-weight:800;font-size:26px;margin:0;letter-spacing:-.01em;font-stretch:88%}
.user{display:flex;align-items:center;gap:14px;font-size:13px}
.user .nm{font-weight:600}.user .rl{color:var(--muted)}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-weight:500}
.lnk:hover{text-decoration:underline}

/* Barre des parcs */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow);margin-bottom:14px}
.sites{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 2px 0 8px}
.grp:first-child{margin-left:0}
.sep{width:1px;height:24px;background:var(--line);margin:0 6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid #d5dce6;background:#fff;border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--ink2)}
.chip:hover{border-color:#b9c4d4}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.tot::before{content:"◆";font-size:10px}
.period{display:flex;gap:8px;align-items:center}
.sel,.inp{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:32px}
.sel:focus,.inp:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}

/* Onglets */
.tabs{display:flex;gap:4px;margin:0 0 14px;border-bottom:1px solid var(--line);align-items:flex-end}
.tab{background:none;border:0;padding:10px 14px 11px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:15px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .b{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.tabs .grow{flex:1}

/* Tuiles de présentation */
.ptitle{display:flex;align-items:baseline;justify-content:space-between;margin:2px 0 12px}
.ptitle h2{font-family:var(--f-d);font-weight:800;font-size:24px;margin:0;font-stretch:90%}
.ptitle .sub{color:var(--muted);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:16px}
body.narrow .tiles{grid-template-columns:repeat(2,1fr)}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:132px}
.tile .l{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.tile .v{font-family:var(--f-d);font-weight:800;font-size:38px;letter-spacing:-.01em;margin-top:6px;font-stretch:90%;line-height:1.1;color:var(--ink2)}
.tile .s{font-size:13px;color:var(--muted);margin-top:4px}
/* Chiffres du bandeau du haut sans gras */
.tile .v,.acc2 .n,.acc2 .p{font-weight:500!important}
.rb b{font-weight:500!important}
.tile.dark{background:var(--slate);border-color:var(--slate)}
.tile.dark .l{color:#dce3ec}.tile.dark .v{color:#fff}.tile.dark .s{color:#dce3ec}
.tile.ac::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.tile.ac .v{color:var(--c)}
.tile .bar2{height:5px;border-radius:99px;background:var(--line2);margin-top:9px;overflow:hidden}
.tile.dark .bar2{background:rgba(255,255,255,.2)}
.tile .bar2 i{display:block;height:100%;border-radius:99px;background:var(--pos)}
.tile .bar2 i.ko{background:#e5a23a}
.accs{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:16px}
body.narrow .accs{grid-template-columns:repeat(2,1fr)}
.acc2{background:#fff;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:12px 16px 12px;box-shadow:var(--shadow)}
.acc2 .l{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.acc2 .row{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.acc2 .n{font-family:var(--f-d);font-weight:800;font-size:30px;color:var(--ink2);font-stretch:90%}
.acc2 .p{font-family:var(--f-d);font-weight:800;font-size:22px;color:var(--c);font-stretch:90%}
.acc2 .bar2{height:5px;border-radius:99px;background:var(--line2);margin-top:6px;overflow:hidden}
.acc2 .bar2 i{display:block;height:100%;background:var(--c);border-radius:99px}
.acc2 .s{font-size:12px;color:var(--muted);margin-top:5px}
.ribbon{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:18px}
body.narrow .ribbon{grid-template-columns:repeat(2,1fr)}
.rb{border-top:2px solid var(--ink2);padding:10px 2px 2px;font-size:15px;color:var(--ink2)}
.rb b{font-family:var(--f-d);font-size:24px;font-weight:800;margin-right:6px;color:var(--ink);font-stretch:92%}
.rb.alert b{color:var(--neg)}
.rbo{font-size:13px;color:var(--muted);margin-top:2px}.rbo .pos{color:var(--pos);font-weight:700}.rbo .neg{color:var(--neg);font-weight:700}
.pz{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:4px 0 6px;background:#fff}
.pzh{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 20px;background:#fff;color:var(--ink);border-left:5px solid var(--a);border-bottom:1px solid var(--line)}
.pzt{font-family:var(--f-d);font-size:22px;font-weight:800;font-stretch:92%;letter-spacing:-.01em}.pzt span{font-weight:500;color:var(--muted);font-size:16px}
.pzs{font-size:13px;color:var(--muted);margin-top:3px}
.pzk{display:flex;gap:26px}.pzk>div{border-left:1px solid var(--line);padding-left:16px}
.pzk .kl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pzk .kv{font-family:var(--f-d);font-size:20px;font-weight:700;margin-top:2px;white-space:nowrap}.pzk .kv.ok{color:var(--pos)}.pzk .kv.ko{color:var(--neg)}
.mx.pres{width:100%;border-collapse:separate;border-spacing:0}
.mx.pres th{background:#eef2f8;color:#2b3a52;font-size:11px;padding-top:10px;padding-bottom:10px}
.mx.pres td{padding-top:10px;padding-bottom:10px;font-size:13.5px}
.mx.pres tr:not(.sub):not(.obj):not(.ec):hover td{background-color:#f6f9ff}
.mx.pres td.lab{font-weight:600}
.mx.pres .pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:9px;vertical-align:1px}
.mx.pres tr.sub td{background:#eef2f8!important;color:var(--ink);font-size:14px;border-top:1px solid var(--line)}

.mx.pres tr.obj td{background:#fbf8f0;color:#7a6a45;font-style:italic}
.mx.pres td.tt{min-width:150px}
.mx.pres .tbar{display:flex;justify-content:space-between;align-items:center;gap:10px;height:22px}
.mx.pres .tbar i{display:block;height:8px;border-radius:4px;opacity:.6;flex:none}
.mx.pres .tbar span{position:relative;font-weight:800}
.mx.pres td.ob{color:var(--muted)}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:16px 20px 8px}
body.narrow .ach{grid-template-columns:1fr}
.acg{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:12px 14px 10px;background:#fff}
.acgh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.acgh b{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--c);font-weight:800}.acgh span{font-size:12px;color:var(--muted);font-weight:600}
.acr{display:grid;grid-template-columns:196px 1fr 44px 58px;align-items:center;gap:8px;padding:4px 0;font-size:12.5px}
.acn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.acn .rk{display:inline-block;width:18px;color:var(--muted);font-weight:700}
.act{position:relative;height:12px;background:#f0f2f6;border-radius:6px}
.act i{display:block;height:100%;border-radius:6px}
.act em{position:absolute;top:-3px;bottom:-3px;width:2px;background:#0e1a2b;opacity:.55;z-index:1}
.acv{text-align:right;font-weight:800}.acx{text-align:right;color:var(--muted);font-size:11.5px;white-space:nowrap}
.ach2{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 20px 18px}
body.narrow .ach2{grid-template-columns:1fr}
.acr.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px}.acr.tot .acn{font-weight:800}.acr.tot .act{background:none}
.acx b.ok{color:var(--pos)}.acx b.ko{color:var(--neg)}
.evo{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;height:290px;padding-top:6px}
.evc{display:flex;flex-direction:column;align-items:stretch;min-width:0}
.evv{font-size:10.5px;font-weight:700;text-align:center;color:var(--ink2);height:16px;white-space:nowrap;overflow:visible}
.evb{position:relative;flex:1;display:flex;align-items:flex-end;background:#f6f8fb;border-radius:6px}
.evb i{display:block;width:100%;border-radius:6px 6px 2px 2px}
.evb em{position:absolute;left:-2px;right:-2px;height:2px;background:#0e1a2b;opacity:.6;z-index:1}
.evm{font-size:10.5px;text-align:center;color:var(--muted);font-weight:700;margin-top:4px}
.evc.cur .evm{color:var(--ink)}
.ach2 .acr{grid-template-columns:minmax(150px,200px) 1fr 104px 118px}
.acn .lnk{display:inline-block;max-width:calc(100% - 22px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;text-align:left;font-weight:600}
.ach2 .acv{white-space:nowrap}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:18px 20px 20px}
body.narrow .pgrid{grid-template-columns:1fr}
.pgt{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--c);margin-bottom:8px;padding-left:2px}
.pcard{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer}
.pcard:hover{background:#f6f9ff;border-color:#c9d6ee}.pcard b{color:var(--muted);font-weight:600}
.chp{display:inline-block;min-width:46px;text-align:center;padding:2px 8px;border-radius:999px;font-weight:700;font-size:12px;background:#eef1f5;color:var(--muted)}
.chp.ok{background:#e3f4ea;color:#1e7a45}.chp.ko{background:#fde8e5;color:#b8352a}

.cumul{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px 18px;margin-bottom:18px;box-shadow:0 1px 3px rgba(14,26,43,.05)}
.cumul .ch{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px}
.cumul .ch span{color:var(--ink);font-weight:800;margin-right:4px}
.cumul .cg{display:grid;grid-template-columns:repeat(6,1fr);gap:0}
body.narrow .cumul .cg{grid-template-columns:repeat(2,1fr);row-gap:14px}
.cumul .ck{padding:2px 18px;border-left:1px solid var(--line)}
.cumul .ck:first-child{border-left:0;padding-left:0}
.cumul .cl{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);font-weight:700}
.cumul .cv{font-family:var(--f-d);font-size:30px;font-weight:700;font-stretch:92%;margin:4px 0 2px;color:var(--ink);white-space:nowrap}
.cumul .ck.alert .cv{color:var(--neg)}
.cumul .co{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.cumul .co b{font-weight:700}.cumul .co b.ok{color:var(--pos)}.cumul .co b.ko{color:var(--neg)}
.cumul .cb{height:5px;border-radius:3px;background:#eef1f5;margin-top:8px;overflow:hidden}
.cumul .cb i{display:block;height:100%;background:var(--c);border-radius:3px}

.mx.lfi td,.mx.lfi th{padding-left:2px;padding-right:4px;font-size:12.5px}.mx.lfi td.lab{font-size:13px}.mx.lfi td.fi.pos,.mx.lfi td.fi.neg{font-weight:500}

/* Cartes */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chead h3{font-family:var(--f-d);font-size:17px;font-weight:800;margin:0;font-stretch:92%}
.chead .sub{color:var(--muted);font-size:12.5px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:7px 13px;font-weight:600;min-height:32px}
.btn:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{background:#fff;color:var(--ink2);border-color:var(--line)}
.btn.ghost:hover{border-color:#c0cad8;background:#fafbfc}
.btn.danger{background:#fff;color:var(--neg);border-color:#f3c3c0}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;font-weight:600;color:var(--muted);font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.empty{padding:40px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.note{font-size:12.5px;color:var(--muted)}
.pad{padding:14px}

/* Tableau des commandes façon Excel */
.xw{overflow-y:auto;overflow-x:hidden;max-height:calc(100vh - 250px);background:#fff;border-top:1px solid var(--line)}
table.xl{border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;font-size:11px;table-layout:fixed;width:100%}
table.xl th,table.xl td{border:1px solid #c8c8c8;padding:3px 3px;white-space:nowrap;text-align:center;overflow:hidden;text-overflow:ellipsis}
table.xl thead th{overflow-wrap:anywhere;text-overflow:clip}
table.xl thead th{position:sticky;z-index:2;font-size:8px;font-weight:400;line-height:1.15;white-space:normal;vertical-align:middle;padding:4px 3px}
table.xl thead tr.g th{top:0;height:20px;background:#fff;border:0}
table.xl thead tr.g th.acc{border:1px solid #000;font-size:10px;background:#fff}
table.xl thead tr.h th{top:0;height:52px}
table.xl tbody tr{cursor:pointer}
table.xl tbody tr:hover td{background:#eaf1ff}
table.xl td.l,table.xl td.r{text-align:center}   /* tout centré, comme demandé */
table.xl tbody td{vertical-align:middle}
table.xl tr.annul td{color:#9aa3b2;text-decoration:line-through}
table.xl tr.annul td.u{text-decoration:none;color:#fff;background:#ff0000}
table.xl td.neg{color:#c00000}
table.xl td.st{color:#c00000;font-weight:700}
table.xl tfoot td{position:sticky;bottom:0;background:#f3f5f8;font-weight:700}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:#fbfcfd}
.filters .inp{width:220px}
.cnt{color:var(--muted);font-size:12.5px;margin-left:auto}

/* Récap */
table.mx{border-collapse:separate;border-spacing:0;width:100%}
.mx td,.mx th{padding:8px 9px;border-bottom:1px solid var(--line2);white-space:nowrap;text-align:right;font-size:13px}
.mx th{background:#f8f9fb;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}
.mx th.lab,.mx td.lab{text-align:left;font-weight:600;min-width:190px}
.mx tr.sub td{font-weight:800;background:#f3f6fb;border-top:1px solid var(--line)}
.mx tr.obj td{color:var(--muted);background:#fffaf0}
.mx tr.ec td{font-weight:700}
.mx tr.na td{color:var(--neg)}
.mx td.tt,.mx th.tt{border-left:1px solid var(--line);font-weight:800;background:#f6f8fb}
.mx tr.sub td.tt{background:#e9eef6}
.mx th.pair{border-left:1px solid var(--line)}
.mx td.fi{color:var(--muted)}
.mx td.pos{color:var(--pos);font-weight:600}.mx td.neg{color:var(--neg);font-weight:600}
.mx td.z{color:#c3cad6}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.secs{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between}

/* Paramètres */
.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.pg textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit}
.og td,.og th{padding:4px 6px}
.og input{width:100%;text-align:right;border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.og input:disabled{background:#f8f9fb;border-color:transparent}

/* Panneau latéral */
.drawer{position:fixed;inset:0;background:rgba(14,26,43,.32);z-index:50;display:flex;justify-content:flex-end}
.dbox{width:680px;max-width:100%;height:100%;background:var(--panel);display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(14,26,43,.15)}
.dhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dhead h3{margin:2px 0 0;font-family:var(--f-d);font-size:22px;font-weight:800;font-stretch:90%}
.dbox form{display:flex;flex-direction:column;height:100%;min-height:0}
.dbody{flex:1;min-height:0;overflow:auto;padding:6px 20px 20px}
.dfoot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;background:#fafbfc}
.dfoot .grow{flex:1}
.fs{margin-top:14px}
.fs h4{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.fs h4 i{display:inline-block;width:10px;height:10px;border-radius:3px}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px}
.fg .w2{grid-column:span 2}.fg .w3{grid-column:span 3}
.f label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px;font-weight:500}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;min-height:34px}
.f textarea{min-height:64px;resize:vertical}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-weight:600;font-size:12.5px;color:var(--muted)}
.tg[aria-pressed="true"]{background:var(--accent-soft);border-color:#b9cdfb;color:var(--accent-ink)}
.tg.red[aria-pressed="true"]{background:var(--neg-soft);border-color:#f3c3c0;color:var(--neg)}
.meta{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.6}
.dmsg{font-size:12.5px;color:var(--neg)}

/* Historique / admin */
.lg td{white-space:normal;vertical-align:top;text-align:left}
.ad{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:start}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px}
.pp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.ppg{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fbfcfd}
.ppt{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ppt .lnk{font-size:11px;letter-spacing:0;text-transform:none}
label.ppi,.pbox label.ppi,.f label.ppi{display:flex!important;align-items:center;gap:8px;margin:0!important;padding:5px 4px;border-radius:6px;font-size:13px;color:var(--ink2);cursor:pointer}
label.ppi:hover{background:var(--accent-soft)}
label.ppi input{width:16px!important;height:16px;min-height:0!important;padding:0!important;margin:0;flex:none}
.chk label{display:flex;gap:6px;align-items:center;font-size:12.5px;white-space:nowrap}
.creds{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fbfcfd}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.ok{color:var(--pos)}.ko{color:var(--neg)}
table.lt{border-collapse:collapse;width:100%}
.lt td,.lt th{padding:8px 10px;border-bottom:1px solid var(--line2);text-align:left;font-size:13px}
.lt th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#f8f9fb}
.rtag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--line2);color:var(--ink2)}
.rtag.aucun{background:var(--neg-soft);color:var(--neg)}
.rtag.admin{background:var(--ink);color:#fff}

/* Connexion */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lcard{width:100%;max-width:390px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px 26px;box-shadow:var(--shadow)}
.lcard h1{font-family:var(--f-d);font-weight:800;font-size:28px;margin:8px 0 4px;font-stretch:88%}
.lcard p{color:var(--muted);margin:0 0 18px;font-size:13px}
.lcard label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.lcard input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px}
.lcard .btn{width:100%;margin-top:18px;padding:10px;font-size:15px}
.lmsg{min-height:20px;margin-top:12px;font-size:13px;color:var(--neg)}
.modal{position:fixed;inset:0;background:rgba(14,26,43,.32);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.pbox{background:#fff;border-radius:12px;padding:22px;width:100%;max-width:380px}
.pbox h3{margin:0 0 10px;font-family:var(--f-d);font-size:20px}
.pbox label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.pbox input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.row2{display:flex;gap:12px;align-items:center;margin-top:16px}
.flash{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:80;font-weight:500;box-shadow:var(--shadow)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--pos-soft);color:var(--pos)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pos)}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
// ====================================================================
//  Paramètres généraux
// ====================================================================
const DOMAIN = 'vo.plaque-ep.fr';
const GROUPS = ['MB', 'FMC / NSA', 'GVA'];
const MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MOIS_C = ['JANV.','FÉVR.','MARS','AVRIL','MAI','JUIN','JUIL.','AOÛT','SEPT.','OCT.','NOV.','DÉC.'];
const ROLE_LBL = {admin:'Administrateur', directeur:'Directeur', chef:'Chef des ventes', assistante:'Assistante commerciale', aucun:'Aucun accès'};
// Colonnes du classeur, dans le même ordre et avec les mêmes couleurs d'en-tête
const COLS = [
  ['date_cde','DATE CDE','date','#F4B183'],['entite','ENTITÉ','text','#F4B183'],['marque','MARQUE','text','#F4B183'],['modele','MODELE','text','#F4B183'],
  ['immat',"N° D'IMMAT",'text','#F4B183'],['client','CLIENT','text','#F4B183'],['vendeur','VENDEUR','vend','#F8CBAD'],
  ['cession','CESSION','text','#F8CBAD'],['repreneur','REPRENEUR','text','#F8CBAD'],['prix_vente_ht','PRIX DE VENTE HT','eur','#FFE699'],
  ['jours_stock','NBRE JOUR STOCK','stock','#FFC000'],['marge_prev','MARGE HT PREVISIONNELLE','eur','#C9C9C9'],
  ['marge_vendeur','MARGE HT VENDEUR','eur','#C9C9C9'],['marge_reelle','MARGE REELLE HT','eur','#4472C4','#fff'],
  ['remise_ttc','REMISE TTC','eur','#8497B0','#fff'],['frais_admin','FRAIS ADMIN','bool','#C6E0B4'],['eurodatacar','EURODATACAR','bool','#C6E0B4'],
  ['pack_liv','PACK LIV 990','bool','#C6E0B4'],['coyote','COYOTE','bool','#ED7D31'],['protech','PROTECH','bool','#ED7D31'],
  ['bulbbee','BULBEE','bool','#ED7D31'],['annulation','ANNULATION','bool','#FF0000','#fff'],['date_fact','DATE DE FACTURE','date','#8EA9DB'],
  ['garantie','GARANTIE','gar','#70AD47'],['fi','CRÉDIT','bool','#8EA9DB'],['loa','LOA','bool','#8EA9DB'],['lld','LLD','bool','#8EA9DB'],['ca_fin','CA FI HT','eur','#8EA9DB'],
  ['assurance','ASSURANCE','bool','#8EA9DB'],['ass_pf','PERTE FI','bool','#8EA9DB'],['ass_deces','DÉCÈS','bool','#8EA9DB'],['ass_extgar','EXT. GAR.','bool','#8EA9DB'],['organisme','ORGANISME','org','#8EA9DB'],
  ['reprise','REPRISE','bool','#FFFF00'],['depot','DÉPÔT','text','#FFFF00'],['commentaires','COMMENTAIRES','text','#FFC000'],
];
// Ordre des colonnes du classeur Excel (A → AD), utilisé pour l'import
const XL_ORDER = ['date_cde','marque','modele','immat','client','vendeur','cession','repreneur','prix_vente_ht','jours_stock','marge_prev','marge_vendeur','marge_reelle','remise_ttc','frais_admin','eurodatacar','pack_liv','coyote','protech','bulbbee','annulation','date_fact','garantie','fi','ca_fin','assurance','organisme','loa','reprise','commentaires'];
const HIDE_GRID = ['repreneur', 'assurance', 'depot', 'pack_liv', 'commentaires'];   // colonnes conservées en base mais retirées de l'affichage
const GCOLS = site => COLS.filter(c => !HIDE_GRID.includes(c[0]) && !(site && c[0] === 'entite' && !entList(site).length));   // pas de colonne Entité sur les parcs mono-entité
const COLW = {date_cde:50,entite:50,marque:70,modele:60,immat:60,client:64,vendeur:64,cession:46,repreneur:70,prix_vente_ht:56,jours_stock:36,marge_prev:50,marge_vendeur:52,marge_reelle:52,remise_ttc:40,frais_admin:40,eurodatacar:44,pack_liv:28,coyote:46,protech:50,bulbbee:48,annulation:46,date_fact:54,garantie:54,fi:42,ca_fin:52,assurance:46,organisme:58,loa:26,reprise:46,commentaires:32,ass_pf:36,ass_deces:38,ass_extgar:32,lld:26};
// Ventes hors volume (comme dans le classeur) : comptées dans la marge, pas dans les commandes ni les livraisons
const HORS_VOL = ['CESSION', 'ALCOPA', 'MARCHAND'];
// Base commune à tous les parcs (ajoutée automatiquement à la liste des vendeurs de chaque parc)
const BASE_VEND = ['ALCOPA', 'MARCHAND', 'CESSION', 'DIRECTION'];
// Marge réelle calculée automatiquement = marge vendeur + montant (parcs concernés)
const MARGE_PLUS = {'mb-villeneuve': 500, 'mb-cannes': 500};
const MARGE_PLUS_EXCLUS = ['CESSION', 'ALCOPA'];   // pour ces lignes, la marge réelle se saisit à la main
const MARQ_DEF = {'MB': ['MERCEDES', 'AM'], 'FMC / NSA': ['FORD', 'NISSAN', 'AM'], 'GVA': ['VOLKSWAGEN', 'AUDI', 'AM'], 'GEELY': ['GEELY', 'AM'], 'BYD': ['BYD', 'AM']};
// Entités par parc (réglables dans « Vendeurs & objectifs ») et marque associée à chaque entité
const ENT_DEF = {'mb-villeneuve': ['MB', 'GEELY'], 'mb-roquebrune': ['MB', 'VUL', 'BYD'], 'mb-toulon': ['MB', 'VUL', 'BYD'], 'nsa-cannes': ['NSA', 'FMC', 'GEELY'], 'fmc-nice': ['FMC', 'NSA']};
const ENT_MARQ = {MB: 'MERCEDES', VUL: 'MERCEDES', VO: 'AM', GEELY: 'GEELY', BYD: 'BYD', NSA: 'NISSAN', FMC: 'FORD', AUDI: 'AUDI', VW: 'VOLKSWAGEN'};
const ENT_NONE = ['mb-cannes', 'audi', 'vw-toulon', 'vw-ollioules', 'six-fours'];   // parcs sans entité
const entList = site => { if (ENT_NONE.includes(site)) return []; const l = ((S.params[site] || {}).entites) || []; return l.length ? l : (ENT_DEF[site] || []); };
const marqList0 = site => { const e = entList(site); return e.length ? [...new Set([...e.map(x => ENT_MARQ[x] || x), 'AM'])] : null; };
const marqList = site => { const l = ((S.params[site] || {}).marques) || []; return l.length ? l : (marqList0(site) || MARQ_DEF[(S.sites.find(x => x.slug === site) || {}).grp] || ['AM']); };
const vendList = site => [...new Set([...(((S.params[site] || {}).vendeurs) || []), ...BASE_VEND])];
const BOOLS = COLS.filter(c => c[2] === 'bool').map(c => c[0]);
const NUMS = COLS.filter(c => c[2] === 'eur' || c[2] === 'int').map(c => c[0]);

// ====================================================================
//  État
// ====================================================================
const S = {
  sb: null, session: null, me: null,
  sites: [], params: {}, obj: {}, rows: [], names: {},
  sel: null,            // {t:'site', s:'mb-villeneuve'} | {t:'grp', g:'MB'} | {t:'all'}
  tab: 'recap', year: new Date().getFullYear(), month: new Date().getMonth() + 1,
  recapSec: null, totSec: null, ent: null,   // détail masqué tant qu'on n'a pas cliqué sur un onglet
  f: {q: '', vend: '', mois: '', vue: 'toutes'},
  live: false,
};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf0 = new Intl.NumberFormat('fr-FR', {maximumFractionDigits: 0});
const N = v => (v == null || v === '' || isNaN(v)) ? 0 : Number(v);
const fN = v => v ? nf0.format(Math.round(v)) : '-';
const fE = v => v ? nf0.format(Math.round(v)) + ' €' : '-';
const fP = v => (v == null || !isFinite(v)) ? '-' : Math.round(v * 100) + ' %';
const fD = d => d ? d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(2, 4) : '';
const ym = d => d ? [Number(d.slice(0, 4)), Number(d.slice(5, 7))] : [0, 0];
function flash(t) { const d = document.createElement('div'); d.className = 'flash'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

// Même présentation quelle que soit la taille de l'écran (projection sur grand écran)
function fit() {
  const w = window.innerWidth;
  if (w < 900) { document.body.classList.add('narrow'); document.body.style.zoom = ''; return; }
  document.body.classList.remove('narrow');
  document.body.style.zoom = (w / 1600).toFixed(4);
}
window.addEventListener('resize', fit);

// ====================================================================
//  Démarrage et connexion
// ====================================================================
async function boot() {
  fit();
  try {
    if (location.protocol === 'file:') throw new Error("Ce fichier ne s'ouvre pas en double-cliquant dessus : il fonctionne uniquement une fois mis en ligne sur Cloudflare Pages (voir le GUIDE, étapes 2 et 3), à l'adresse du type tableau-commandes.pages.dev.");
    let res;
    try { res = await fetch('/api/config', {cache: 'no-store'}); }
    catch (e) { throw new Error("Impossible de joindre le serveur du site. Ouvrez l'outil depuis son adresse Cloudflare (tableau-commandes.pages.dev), pas depuis le fichier."); }
    if (res.status === 404) throw new Error("Le dossier « functions » n'a pas été publié. Sur Cloudflare, le projet doit être relié à GitHub (Connect to Git), pas créé par glisser-déposer — voir le GUIDE, étape 3.");
    const cfg = await res.json().catch(() => { throw new Error("Le dossier « functions » n'a pas été publié correctement (voir le GUIDE, étape 3)."); });
    if (cfg.error) throw new Error(cfg.error + ' — dans Cloudflare : Settings → Variables and Secrets, puis Deployments → Retry deployment.');
    S.sb = supabase.createClient(cfg.url, cfg.anon);
  } catch (e) {
    $('#app').innerHTML = '<div class="login"><div class="lcard"><h1>Configuration</h1><p class="ko">' + esc(e.message || e) + '</p></div></div>';
    return;
  }
  const { data } = await S.sb.auth.getSession();
  if (data && data.session) { S.session = data.session; await start(); } else loginView();
}

function loginView(msg) {
  $('#app').innerHTML = `<div class="login"><form class="lcard" id="lf">
    <div class="eyebrow">Plaque EP · Service VO</div><h1>Tableau des Commandes</h1>
    <p>Connectez-vous avec votre identifiant habituel (le même que Prospection Atelier).</p>
    <label>Identifiant</label><input id="li" autocomplete="username" placeholder="prenom.nom" required>
    <label>Mot de passe</label><input id="lp" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Se connecter</button><div class="lmsg" id="lm">${esc(msg || '')}</div></form></div>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const id = $('#li').value.trim().toLowerCase();
    const email = id.includes('@') ? id : id + '@' + DOMAIN;
    $('#lm').textContent = 'Connexion…';
    const { data, error } = await S.sb.auth.signInWithPassword({ email, password: $('#lp').value });
    if (error) { $('#lm').textContent = 'Identifiant ou mot de passe incorrect.'; return; }
    S.session = data.session; await start();
  };
}

async function logout() { await S.sb.auth.signOut(); location.reload(); }

async function start() {
  $('#app').innerHTML = '<div class="empty" style="padding-top:120px"><b>Chargement…</b></div>';
  const { data: me, error } = await S.sb.rpc('tc_me');
  if (error) { loginView('Erreur : ' + error.message); return; }
  S.me = me;
  if (!me || me.role === 'aucun') {
    $('#app').innerHTML = `<div class="login"><div class="lcard"><div class="eyebrow">Plaque EP · Service VO</div><h1>Accès non autorisé</h1>
      <p>Votre compte n'a pas accès au Tableau des Commandes. Rapprochez-vous de votre administrateur.</p>
      <button class="btn ghost" onclick="logout()">Se déconnecter</button></div></div>`;
    return;
  }
  await loadAll();
  const mine = S.sites.filter(s => (S.me.sites || []).includes(s.slug));
  S.sel = mine.length ? {t: 'site', s: mine[0].slug} : {t: 'all'};
  S.tab = 'cmd';
  render();
  subscribe();
}

async function loadAll() {
  const sb = S.sb;
  const [si, pa, ob, pr] = await Promise.all([
    sb.from('tc_sites').select('*').order('ordre'),
    sb.from('tc_params').select('*'),
    sb.from('tc_objectifs').select('*'),
    sb.from('profiles').select('id,nom'),
  ]);
  S.sites = (si.data || []).filter(s => S.me.role === 'admin' || (S.me.sites || []).includes(s.slug));
  S.params = {}; (pa.data || []).forEach(p => S.params[p.site] = p);
  S.obj = {}; (ob.data || []).forEach(o => S.obj[o.site + '|' + o.annee + '|' + o.mois] = o);
  S.names = {}; (pr.data || []).forEach(p => S.names[p.id] = p.nom);
  const rows = []; let from = 0;
  for (;;) {
    const { data, error } = await sb.from('tc_commandes').select('*').order('date_cde', {ascending: false}).range(from, from + 999);
    if (error) { flash('Erreur de chargement : ' + error.message); break; }
    rows.push(...data); if (data.length < 1000) break; from += 1000;
  }
  S.rows = rows;
}

let rtTimer = null;
function subscribe() {
  try {
    S.sb.channel('tc').on('postgres_changes', {event: '*', schema: 'public', table: 'tc_commandes'}, p => {
      if (p.eventType === 'DELETE') S.rows = S.rows.filter(r => r.id !== (p.old && p.old.id));
      else {
        const i = S.rows.findIndex(r => r.id === p.new.id);
        if (i >= 0) S.rows[i] = p.new; else S.rows.unshift(p.new);
      }
      clearTimeout(rtTimer); rtTimer = setTimeout(() => { if (!$('.drawer') && !$('.modal')) renderMain(); }, 400);
    }).subscribe(st => { S.live = st === 'SUBSCRIBED'; const l = $('#live'); if (l) l.hidden = !S.live; });
  } catch (e) { /* le temps réel est un plus : sans lui l'outil fonctionne */ }
}

// ====================================================================
//  Droits côté écran (la base les vérifie aussi)
// ====================================================================
const canEdit = site => S.me.role === 'admin' || (['directeur','chef','assistante'].includes(S.me.role) && S.me.sites.includes(site));
const canParam = site => S.me.role === 'admin' || (['directeur','chef'].includes(S.me.role) && S.me.sites.includes(site));
const siteObj = slug => S.sites.find(s => s.slug === slug) || {slug, label: slug, grp: ''};
function selSites() {
  if (!S.sel) return [];
  if (S.sel.t === 'site') return [S.sel.s];
  if (S.sel.t === 'grp') return S.sites.filter(s => s.grp === S.sel.g).map(s => s.slug);
  return S.sites.map(s => s.slug);
}
function selLabel() {
  if (S.sel.t === 'site') return siteObj(S.sel.s).label;
  if (S.sel.t === 'grp') return 'Total ' + S.sel.g;
  return S.me.role === 'admin' ? 'Plaque EP' : 'Total mes parcs';
}

// ====================================================================
//  Rendu général
// ====================================================================
function render() {
  const me = S.me;
  const groups = [...new Set(S.sites.map(s => s.grp))].map(g => ({g, sites: S.sites.filter(s => s.grp === g)})).filter(x => x.sites.length);
  const pressed = c => c ? 'aria-pressed="true"' : 'aria-pressed="false"';
  let chips = '';
  groups.forEach((x, i) => {
    if (i) chips += '<span class="sep"></span>';
    chips += `<span class="grp">${esc(x.g)}</span>`;
    x.sites.forEach(s => chips += `<button class="chip" ${pressed(S.sel.t === 'site' && S.sel.s === s.slug)} onclick="pick('site','${s.slug}')">${esc(s.label)}</button>`);
    if (x.sites.length > 1) chips += `<button class="chip tot" ${pressed(S.sel.t === 'grp' && S.sel.g === x.g)} onclick="pick('grp','${x.g}')">Total ${esc(x.g)}</button>`;
  });
  if (groups.length > 1) chips += `<span class="sep"></span><button class="chip tot" ${pressed(S.sel.t === 'all')} onclick="pick('all')">${me.role === 'admin' ? 'Plaque EP' : 'Total mes parcs'}</button>`;
  const years = []; const y0 = new Date().getFullYear();
  for (let y = y0 + 1; y >= 2025; y--) years.push(y);
  $('#app').innerHTML = `<div class="wrap">
    <div class="top"><div class="brand"><div class="logo"><svg width="22" height="22" viewBox="0 0 64 64"><path d="M22 16h-3a4 4 0 0 0-4 4v28a4 4 0 0 0 4 4h26a4 4 0 0 0 4-4V20a4 4 0 0 0-4-4h-3M24 12h16v8H24zM24 32h16M24 40h10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></svg></div>
      <div><div class="eyebrow">Plaque EP · Service VO</div><h1>Tableau des Commandes</h1></div></div>
      <div class="user"><span class="live" id="live" ${S.live ? '' : 'hidden'}>En direct</span>
        <span><span class="nm">${esc(me.nom || me.identifiant)}</span> · <span class="rl">${esc(ROLE_LBL[me.role] || me.role)}</span></span>
        ${me.role === 'admin' ? `<button class="lnk" onclick="go('admin')">Administration</button>` : ''}
        <button class="lnk" onclick="pwdModal()">Mot de passe</button><button class="lnk" onclick="logout()">Déconnexion</button></div></div>
    <div class="bar"><div class="sites">${chips}</div>
      <div class="period"><select class="sel" id="yr" onchange="S.year=+this.value;renderMain()">${years.map(y => `<option ${y === S.year ? 'selected' : ''}>${y}</option>`).join('')}</select>
      <select class="sel" id="mo" onchange="S.month=+this.value;renderMain()">${MOIS.map((m, i) => `<option value="${i + 1}" ${i + 1 === S.month ? 'selected' : ''}>${m}</option>`).join('')}</select></div></div>
    <div id="main"></div></div>`;
  renderMain();
}
function pick(t, v) { S.ent = null; S.sel = t === 'site' ? {t, s: v} : t === 'grp' ? {t, g: v} : {t: 'all'}; if (S.sel.t !== 'site' && !['recap','admin'].includes(S.tab)) S.tab = 'recap'; if (S.sel.t === 'site') S.tab = 'cmd'; render(); }

function pickRecap(s) { S.ent = null; S.sel = {t: 'site', s}; S.tab = 'recap'; S.recapSec = null; render(); window.scrollTo(0, 0); }

function renderMain() {
  const m = $('#main'); if (!m) return;
  const site = S.sel.t === 'site' ? S.sel.s : null;
  const tabs = [];
  if (site) {
    const n = S.rows.filter(r => r.site === site && ym(r.date_cde)[0] === S.year).length;
    tabs.push(['cmd', `Commandes VO <span class="b">${n}</span>`]);
    tabs.push(['recap', 'Récap']);

  let h = `<div class="tabs">${tabs.map(t => `<button class="tab" aria-selected="${S.tab === t[0]}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}<span class="grow"></span></div>`;

// ====================================================================
//  Calculs (mêmes règles que le classeur Excel)
//  Commandes : date de commande · Livraisons, marge, financement, garanties, accessoires : date de facture
//  Une commande annulée est exclue de tous les calculs.
// ====================================================================
function stats(sites, year, ent) {
  const z = () => Array(13).fill(0);
  const out = {cde: z(), liv: z(), fi: z(), marge: z(), caf: z(), coy: z(), pro: z(), bul: z(), am: z(), fa: z(), edc: z(), rep: z(),
    v: {}, org: {}, gar: {}, sites};
  const vl = sites.length === 1 ? vendList(sites[0]) : [];
  const vk = name => { const k = (name || '').trim().toUpperCase(); return vl.includes(k) ? k : '__NA'; };
  const V = k => out.v[k] || (out.v[k] = {cde: z(), liv: z(), fi: z(), marge: z(), caf: z(), coy: z(), pro: z(), bul: z(), am: z(), fa: z(), edc: z(), rep: z()});
  for (const r of S.rows) {
    if (!sites.includes(r.site) || r.annulation) continue;
    if (ent && (r.entite || '').toUpperCase() !== ent) continue;
    const [yc, mc] = ym(r.date_cde), [yf, mf] = ym(r.date_fact);
    const k = vk(r.vendeur), hv = HORS_VOL.includes((r.vendeur || '').trim().toUpperCase());
    if (yc === year && mc) { if (!hv) out.cde[mc]++; V(k).cde[mc]++; }
    if (yf === year && mf) {
      const v = V(k);
      if (!hv) out.liv[mf]++; v.liv[mf]++;
      if (r.fi || r.loa || r.lld || N(r.ca_fin) > 0) { if (!hv) out.fi[mf]++; v.fi[mf]++; }   // dossier financé : crédit, LOA ou LLD
      out.marge[mf] += N(r.marge_reelle); v.marge[mf] += N(r.marge_reelle);
      if (!hv) out.caf[mf] += N(r.ca_fin); v.caf[mf] += N(r.ca_fin);
      const c = hv ? 0 : 1;   // les ventes hors volume ne comptent pas dans les totaux (comme le classeur)
      if (r.coyote) { out.coy[mf] += c; v.coy[mf]++; }
      if (r.frais_admin) { out.fa[mf] += c; v.fa[mf]++; }
      if (r.eurodatacar) { out.edc[mf] += c; v.edc[mf]++; }
      if (r.reprise) { out.rep[mf] += c; v.rep[mf]++; }
      if (r.protech) { out.pro[mf] += c; v.pro[mf]++; }
      if (r.bulbbee) { out.bul[mf] += c; v.bul[mf]++; }
      if ((r.marque || '').trim().toUpperCase() === 'AM') { out.am[mf] += c; v.am[mf]++; }
      const o = (r.organisme || '').trim().toUpperCase(); if (N(r.ca_fin) && !hv) { (out.org[o] || (out.org[o] = z()))[mf] += N(r.ca_fin); }
      const g = (r.garantie || '').trim().toUpperCase(); (out.gar[g] || (out.gar[g] = z()))[mf]++;
    }
  }
  const sum = a => a.slice(1).reduce((x, y) => x + y, 0);
  for (const k of ['cde','liv','fi','marge','caf','coy','pro','bul','am','fa','edc','rep']) out[k][0] = sum(out[k]);
  Object.values(out.v).forEach(v => Object.keys(v).forEach(k => v[k][0] = sum(v[k])));
  Object.values(out.org).forEach(a => a[0] = sum(a)); Object.values(out.gar).forEach(a => a[0] = sum(a));
  // Objectifs
  out.oc = z(); out.ol = z(); out.om = z(); out.ocaf = z(); out.oip = z(); out.oorg = {}; const nip = z();
  if (!ent) for (const s of sites) for (let m = 1; m <= 12; m++) {   // objectifs : au niveau du parc (vue Global)
    const o = S.obj[s + '|' + year + '|' + m]; if (!o) continue;
    out.oc[m] += N(o.cde); out.ol[m] += N(o.liv); out.om[m] += N(o.marge); out.ocaf[m] += N(o.caf);
    if (o.ipfi != null && o.ipfi !== '') { out.oip[m] += N(o.ipfi) / 100; nip[m]++; }
    Object.entries(o.org || {}).forEach(([k, v]) => { if (N(v)) (out.oorg[k] || (out.oorg[k] = z()))[m] += N(v); });
  }
  Object.values(out.oorg).forEach(a => a[0] = sum(a));
  ['oc','ol','om','ocaf'].forEach(k => out[k][0] = sum(out[k]));
  for (let m = 1; m <= 12; m++) out.oip[m] = nip[m] ? out.oip[m] / nip[m] : 0;   // IP FI : moyenne des parcs
  { const v = out.oip.slice(1).filter(Boolean); out.oip[0] = v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; }
  out.vl = vl;
  return out;
}

// ---------- Récap d'un parc ----------

  const ents = entList(site);

  const st = stats([site], S.year, S.ent);
  const secs = [['cde','Commandes'],['liv','Livraisons & FI'],['marge','Marge'],['fin','Financement'],['gar','Garanties'],['acc','Accessoires'],['am','Ventes AM']];
  const sansEnt = S.ent ? S.rows.filter(r => r.site === site && !r.annulation && !r.entite && (ym(r.date_cde)[0] === S.year || ym(r.date_fact)[0] === S.year)).length : 0;

function presTable(K, per, st, f, val, title) {

function cmdFiltered(site) {
  const f = S.f, q = f.q.trim().toLowerCase();
  return S.rows.filter(r => {
    if (r.site !== site) return false;
    const yc = ym(r.date_cde)[0], yf = ym(r.date_fact)[0];
    if (yc !== S.year && yf !== S.year && !(f.vue === 'nonfact' && !r.date_fact)) return false;
    if (f.vue === 'nonfact' && (r.date_fact || r.annulation)) return false;
    if (f.vue === 'annul' && !r.annulation) return false;
    if (f.vue === 'mois' && !(yc === S.year && ym(r.date_cde)[1] === S.month)) return false;
    if (f.vue === 'fact' && !(yf === S.year && ym(r.date_fact)[1] === S.month)) return false;
    if (f.vend && (r.vendeur || '').toUpperCase() !== f.vend) return false;
    if (q && !['immat','client','modele','marque','vendeur','commentaires','repreneur'].some(k => (r[k] || '').toLowerCase().includes(q))) return false;
    return true;
  }).sort((a, b) => (b.date_cde || '').localeCompare(a.date_cde || ''));
}

    if (t === 'int' || t === 'stock') return `<td class="${N(v) > 180 ? 'st' : ''}" title="${esc(v)}">${v == null ? '' : esc(v)}</td>`;
    if (k === 'client' || k === 'commentaires') return `<td class="l" title="${esc(v)}">${esc(v)}</td>`;
    return `<td title="${esc(v)}">${esc(v)}</td>`;
  };
  const tot = k => rows.filter(r => !r.annulation).reduce((s, r) => s + N(r[k]), 0);
  const cnt = k => rows.filter(r => !r.annulation && r[k]).length;
  const GC = GCOLS(site);
  const accStart = GC.findIndex(c => c[0] === 'frais_admin'), accEnd = GC.findIndex(c => c[0] === 'bulbbee');

  g += '</tr>';
  const h = `<tr class="h">${GC.map(c => `<th style="background:${c[3]};color:${c[4] || '#000'}">${c[1]}</th>`).join('')}</tr>`;
  const cg = `<colgroup>${GC.map(c => `<col style="width:${COLW[c[0]]}px">`).join('')}</colgroup>`;
  const body = rows.slice(0, 1500).map(r => `<tr class="${r.annulation ? 'annul' : ''}" onclick="openCmd('${r.id}')">${GC.map(c => cell(c, r)).join('')}</tr>`).join('');
  const foot = `<tr>${GC.map(c => { const [k, , t] = c; if (k === 'date_cde') return `<td>${rows.filter(r => !r.annulation).length}</td>`; if (t === 'eur') return `<td class="r">${nf0.format(Math.round(tot(k)))} €</td>`; if (t === 'bool' && k !== 'annulation') return `<td>${cnt(k) || ''}</td>`; return '<td></td>'; }).join('')}</tr>`;
  return `<div class="card"><div class="chead"><div><h3>Commandes VO · ${esc(siteObj(site).label)}</h3></div>
      <div class="tools"><button class="btn ghost" onclick="exportCmd('${site}')">Exporter en Excel</button>${edit ? `<button class="btn" onclick="openCmd(null)">+ Nouvelle commande</button>` : ''}</div></div>
    <div class="filters"><div class="seg">${vues.map(v => `<button aria-pressed="${S.f.vue === v[0]}" onclick="S.f.vue='${v[0]}';renderMain()">${v[1]}</button>`).join('')}</div>
      <select class="sel" onchange="S.f.vend=this.value;renderMain()"><option value="">Tous les vendeurs</option>${vends.map(v => `<option ${S.f.vend === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>
      <input class="inp" id="q" placeholder="Rechercher (immat, client, modèle…)" value="${esc(S.f.q)}" oninput="S.f.q=this.value;clearTimeout(window._qt);window._qt=setTimeout(()=>{renderMain();const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)},250)">
      <span class="cnt">${rows.length} ligne${rows.length > 1 ? 's' : ''}</span></div>
    ${rows.length ? `<div class="xw"><table class="xl">${cg}<thead>${h}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>` : `<div class="empty"><b>Aucune commande</b>${edit ? 'Ajoutez la première avec « + Nouvelle commande ».' : ''}</div>`}</div>`;
}

    const upd = () => {
      const auto = !MARGE_PLUS_EXCLUS.includes(vend());
      mr.readOnly = auto; mr.style.background = auto ? '#f3f6fb' : ''; mr.style.fontWeight = auto ? '600' : '';

// Plaque au format AA-123-AA : tirets ajoutés automatiquement pendant la saisie
function fmtImmat(v) {
  const raw = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!/^[A-Z]{1,2}([0-9]{0,3}|[0-9]{3}[A-Z]{0,2})$/.test(raw)) return String(v || '').toUpperCase();
  return [raw.slice(0, 2), raw.slice(2, 5), raw.slice(5, 7)].filter(Boolean).join('-');
}
function closeDrawer() { const d = $('.drawer'); if (d) d.remove(); renderMain(); }
async function saveCmd(id, site) {
  const f = $('#cf'), o = {site};
  COLS.forEach(([k, , t]) => {
    if (k === 'reprise') { const b = f.querySelector('#rep button[aria-pressed="true"]'); o[k] = !!b && b.textContent === 'Oui'; return; }
    if (t === 'bool') { const b = f.querySelector(`[data-k="${k}"]`); if (b) o[k] = b.getAttribute('aria-pressed') === 'true'; return; }
    if (k === 'entite' && !f.elements.entite_sel) return;
    if (k === 'vendeur' || k === 'marque' || k === 'entite') { const sv = f.elements[k + '_sel'].value; o[k] = (sv === '__AUTRE' ? f.elements[k + '_autre'].value.trim().toUpperCase() : sv) || null; return; }
    if (k === 'depot') { const b = f.querySelector('#dep button[aria-pressed="true"]'); o[k] = b && b.textContent === 'Oui' ? (f.elements.depot_par.value || '?') : null; return; }
    if (k === 'cession') { const b = f.querySelector('#ces button[aria-pressed="true"]'); o[k] = b && b.textContent === 'Oui' ? 'OUI' : null; return; }
    const el = f.elements[k]; if (!el) return;
    if (k === 'immat') { o[k] = fmtImmat(el.value.trim()) || null; return; }
    let v = el.value.trim();
    if (t === 'eur' || t === 'int') o[k] = v === '' ? null : Number(v.replace(',', '.'));
    else if (t === 'date') o[k] = v || null;
    else o[k] = v === '' ? null : (['vendeur', 'marque', 'garantie', 'organisme', 'immat'].includes(k) ? v.toUpperCase() : v);
  });
  if (o.depot === '?') { $('#dm').textContent = 'Dépôt : choisissez Client ou CA Auto Bank.'; return; }
  if (!o.vendeur) { $('#dm').textContent = 'Choisissez ou saisissez le vendeur.'; return; }
  if (f.elements.entite_sel && !o.entite) { $('#dm').textContent = "Choisissez l'entité."; return; }
  if (MARGE_PLUS[site] != null && o.marge_vendeur != null && !MARGE_PLUS_EXCLUS.includes(o.vendeur)) o.marge_reelle = o.marge_vendeur + MARGE_PLUS[site];
  $('#dm').textContent = 'Enregistrement…';
  const q = id ? S.sb.from('tc_commandes').update(o).eq('id', id).select() : S.sb.from('tc_commandes').insert(o).select();
  const { data, error } = await q;
  if (error) { $('#dm').textContent = 'Erreur : ' + error.message; return; }
  const n = data[0], i = S.rows.findIndex(r => r.id === n.id);
  if (i >= 0) S.rows[i] = n; else S.rows.unshift(n);
  flash(id ? 'Commande mise à jour' : 'Commande ajoutée'); closeDrawer();
}
async function delCmd(id) {
  if (!confirm('Supprimer définitivement cette commande ?\n(Pour une annulation client, utilisez plutôt « Annulée ».)')) return;
  const { error } = await S.sb.from('tc_commandes').delete().eq('id', id);
  if (error) { $('#dm').textContent = 'Erreur : ' + error.message; return; }
  S.rows = S.rows.filter(r => r.id !== id); flash('Commande supprimée'); closeDrawer();
}

async function saveObj(site) {
  const by = {};
  document.querySelectorAll('.og input').forEach(i => { const m = +i.dataset.m, r = by[m] || (by[m] = {site, annee: S.year, mois: m, org: Object.assign({}, (S.obj[site + '|' + S.year + '|' + m] || {}).org)});
    const v = i.value.trim() === '' ? null : Number(i.value.replace(/\s/g, '').replace(',', '.'));
    if (i.dataset.k === 'org') { if (v == null) delete r.org[i.dataset.o]; else r.org[i.dataset.o] = v; } else r[i.dataset.k] = v; });
  const rows = Object.values(by);
  const { error } = await S.sb.from('tc_objectifs').upsert(rows);
  if (error) { flash('Erreur : ' + error.message); return; }
  rows.forEach(r => S.obj[site + '|' + r.annee + '|' + r.mois] = r);
  flash('Objectifs enregistrés'); renderMain();
}
async function saveParams(site) {
  const L = k => !$('#p_' + k) ? [] : [...new Set($('#p_' + k).value.split('\n').map(s => s.trim().toUpperCase()).filter(Boolean))];
  const o = {vendeurs: L('vendeurs'), entites: L('entites'), marques: L('marques'), organismes: L('organismes'), garanties: L('garanties'), updated_at: new Date().toISOString()};
  const { error } = await S.sb.from('tc_params').update(o).eq('site', site);
  if (error) { flash('Erreur : ' + error.message); return; }
  Object.assign(S.params[site], o); flash('Listes enregistrées'); renderMain();
}

async function adminView() {
  const { data, error } = await S.sb.rpc('tc_comptes');
  const b = $('#body'); if (!b || S.tab !== 'admin') return;
  if (error) { b.innerHTML = `<div class="card"><div class="empty">${esc(error.message)}</div></div>`; return; }
  S.comptes = data || [];
  const all = S.sites;
  const lbl = s => mapSites(s).map(x => (all.find(y => y.slug === x) || {label: x}).label).join(', ');
  const withAcc = S.comptes.filter(c => c.role !== 'aucun'), sans = S.comptes.filter(c => c.role === 'aucun');

      <table class="lt"><tr><th>Personne</th><th>Rôle</th><th>Parcs</th><th></th></tr>${sans.map(row).join('')}</table></div></div>
    <div><div class="card"><div class="chead"><h3>Créer un compte</h3></div><form class="pad" id="nf">
      <div class="f"><label>Prénom et nom</label><input name="nom" required placeholder="Sandra MARTIN"></div>
      <div class="f" style="margin-top:10px"><label>Rôle</label><select name="role"><option value="assistante">Assistante commerciale</option><option value="chef">Chef des ventes</option><option value="directeur">Directeur</option><option value="admin">Administrateur</option></select></div>
      <div class="f" style="margin-top:10px"><label>Parcs</label>${parcPicker([])}</div>
      <div class="row2"><button class="btn" type="submit">Créer le compte</button><span class="dmsg" id="nm"></span></div><div id="nc"></div></form></div>
    <div class="card"><div class="chead"><h3>Importer un classeur Excel</h3></div><div class="pad">
      <p class="note" style="margin-top:0">Onglet des commandes au format du classeur (colonnes A à AD, en-têtes en ligne 2). Remplace les commandes de l'année choisie pour ce parc.</p>
      <div class="f"><label>Parc</label><select id="is">${all.map(s => `<option value="${s.slug}">${esc(s.label)}</option>`).join('')}</select></div>
      <div class="f" style="margin-top:10px"><label>Année</label><input id="iy" type="number" value="${S.year}"></div>
      <div class="f" style="margin-top:10px"><label>Fichier</label><input id="if" type="file" accept=".xlsx,.xlsm,.xls"></div>
      <div id="ip" class="note" style="margin-top:10px"></div></div></div></div></div>`;
  $('#nf').onsubmit = createAcc;
  $('#if').onchange = previewImport;
}
async function api(body) {
  const { data } = await S.sb.auth.getSession();
  const res = await fetch('/api/admin', {method: 'POST', headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + (data.session ? data.session.access_token : '')}, body: JSON.stringify(body)});
  const j = await res.json().catch(() => ({error: 'Réponse invalide'}));
  if (!res.ok || j.error) throw new Error(j.error || 'Erreur');
  return j;
}
async function createAcc(e) {
  e.preventDefault();
  const f = e.target, sites = [...f.querySelectorAll('.pp input:checked')].map(i => i.value).join(',');
  $('#nm').textContent = 'Création…';
  try {
    const r = await api({action: 'create', nom: f.nom.value, role: f.role.value, sites});
    $('#nm').textContent = '';
    $('#nc').innerHTML = `<div class="creds"><b>Compte créé — à transmettre à ${esc(r.nom)}</b><div class="mono" style="margin-top:6px">Adresse : ${esc(location.origin)}<br>Identifiant : ${esc(r.identifiant)}<br>Mot de passe : ${esc(r.password)}</div></div>`;
    const { data } = await S.sb.rpc('tc_comptes'); S.comptes = data || [];
    f.nom.value = '';
  } catch (err) { $('#nm').textContent = err.message; }
}
async function resetPwd(id) {
  const c = S.comptes.find(x => x.id === id);
  if (!confirm(`Générer un nouveau mot de passe pour ${c.nom} ?\nAttention : c'est aussi son mot de passe Prospection Atelier.`)) return;
  try { const r = await api({action: 'reset', id}); alert(`Nouveau mot de passe de ${c.nom} (${c.identifiant}) :\n\n${r.password}`); }
  catch (err) { alert(err.message); }
}
async function delAcc(id) {
  const c = S.comptes.find(x => x.id === id);
  if (!confirm(`Supprimer définitivement le compte de ${c.nom} (${c.identifiant}) ?\nIl ne pourra plus se connecter. Les commandes qu'il a saisies sont conservées.`)) return;
  try { await api({action: 'delete', id}); flash('Compte supprimé'); adminView(); }
  catch (err) { alert(err.message); }
}
// Liste des parcs à cocher, regroupés par concession

// ---------- Import Excel ----------
function xDate(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 864e5)); return d.toISOString().slice(0, 10); }
  if (v instanceof Date) return new Date(v.getTime() - v.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  const m = String(v).trim().match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
  return null;
}
function xNum(v) { if (v == null || v === '') return null; if (typeof v === 'number') return v; const n = Number(String(v).replace(/[\s€]/g, '').replace(',', '.')); return isNaN(n) ? null : n; }
function xBool(v) { if (v == null) return false; const s = String(v).trim().toUpperCase(); return !(s === '' || s === '0' || s === 'NON' || s === 'FALSE'); }
let IMP = null;
async function previewImport() {
  const file = $('#if').files[0]; if (!file) return;
  const wb = XLSX.read(await file.arrayBuffer(), {cellDates: false});
  const name = wb.SheetNames.find(n => n.trim().toUpperCase() === 'VO') || wb.SheetNames.find(n => /VO|CDE|COMMANDE/i.test(n)) || wb.SheetNames[0];
  const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], {header: 1, raw: true, defval: null});
  const year = +$('#iy').value, rows = [];
  for (let i = 2; i < aoa.length; i++) {
    const a = aoa[i]; if (!a) continue;
    const o = {};
    XL_ORDER.map(k => COLS.find(c => c[0] === k)).forEach(([k, , t], j) => {   // ordre des colonnes du classeur
      const v = a[j];
      if (t === 'date') o[k] = xDate(v);
      else if (t === 'eur' || t === 'int') o[k] = xNum(v);
      else if (t === 'bool') o[k] = xBool(v);
      else { const t2 = v == null ? '' : String(v).trim(); o[k] = t2 === '' ? null : (['vendeur', 'marque', 'garantie', 'organisme', 'immat', 'cession'].includes(k) ? t2.toUpperCase() : t2); }
    });
    if (o.organisme && /^FCA( BANK)?$/.test(o.organisme)) o.organisme = 'CA AUTO BANK';
    COLS.forEach(() => {
    });
    // Lignes vides du classeur (date + formule de marge seulement) : ignorées
    if (!o.client && !o.immat && !o.vendeur && !o.modele) continue;
    if (ym(o.date_cde)[0] !== year && ym(o.date_fact)[0] !== year) continue;
    rows.push(o);
  }
  const vend = [...new Set(rows.map(r => r.vendeur).filter(Boolean))];
  IMP = {site: $('#is').value, year, rows};
  $('#ip').innerHTML = `Onglet « ${esc(name)} » : <b>${rows.length} commandes ${year}</b> trouvées · ${vend.length} vendeurs (${esc(vend.join(', '))}).
    <div class="row2"><button class="btn" onclick="doImport()">Importer dans ${esc(siteObj(IMP.site).label)}</button></div>`;
}
async function doImport() {
  if (!IMP) return;
  if (!confirm(`Remplacer les commandes ${IMP.year} de ${siteObj(IMP.site).label} par les ${IMP.rows.length} lignes du fichier ?`)) return;
  $('#ip').textContent = 'Import en cours…';
  const { data, error } = await S.sb.rpc('tc_import', {p_site: IMP.site, p_annee: IMP.year, p_rows: IMP.rows});
  if (error) { $('#ip').textContent = 'Erreur : ' + error.message; return; }
  const p = S.params[IMP.site];
  const vs = [...new Set(IMP.rows.map(r => r.vendeur).filter(Boolean))];
  if (p && !(p.vendeurs || []).length && vs.length) { await S.sb.from('tc_params').update({vendeurs: vs}).eq('site', IMP.site); p.vendeurs = vs; }
  await loadAll(); flash(data + ' commandes importées'); IMP = null; adminView();
}

// ---------- Exports Excel ----------
function exportCmd(site) {
  const rows = cmdFiltered(site);
  const GC = GCOLS(site), ai = GC.findIndex(c => c[0] === 'frais_admin'), aj = GC.findIndex(c => c[0] === 'bulbbee');
  const aoa = [GC.map(c => c[1])];
  rows.forEach(r => aoa.push(GC.map(([k, , t]) => t === 'bool' ? (r[k] ? 1 : null) : t === 'date' ? (r[k] ? new Date(r[k] + 'T00:00:00') : null) : r[k])));
  const ws = XLSX.utils.aoa_to_sheet(aoa, {cellDates: true});
  ws['!cols'] = GC.map(c => ({wpx: COLW[c[0]] + 10}));
  
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'VO');
  XLSX.writeFile(wb, `Commandes VO ${siteObj(site).label} ${S.year}.xlsx`);
}
// Export d'un total (concession ou Plaque EP) : synthèse, tableaux mensuels par parc et toutes les commandes
function exportTotal() {
  const sites = selSites(), wb = XLSX.utils.book_new(), y = S.year;
  const per = sites.map(x => [siteObj(x).label, stats([x], y)]), tot = stats(sites, y);
  const r0 = v => Math.round(v * 100) / 100, ipv = (a, b) => b ? r0(a / b) : null;
  // 1. Synthèse annuelle
  const syn = [['PARC', 'COMMANDES', 'OBJ. CDE', '% CDE', 'VO LIVRÉS', 'OBJ. LIV', 'FI', 'CA FI HT', 'OBJ. CA FI HT', 'IP FI', 'MARGE RÉELLE HT', 'OBJ. MARGE', '% MARGE', 'MARGE MOY./VO', 'FRAIS ADMIN', 'EURODATACAR', 'COYOTE', 'PROTECH', 'BULBEE', 'REPRISES', 'VENTES AM']];
  const line = (lab, x) => [lab, x.cde[0], x.oc[0] || null, ipv(x.cde[0], x.oc[0]), x.liv[0], x.ol[0] || null, x.fi[0], Math.round(x.caf[0]), x.ocaf[0] || null, ipv(x.fi[0], x.liv[0]), Math.round(x.marge[0]), x.om[0] || null, ipv(x.marge[0], x.om[0]), x.liv[0] ? Math.round(x.marge[0] / x.liv[0]) : null, x.fa[0], x.edc[0], x.coy[0], x.pro[0], x.bul[0], x.rep[0], x.am[0]];
  per.forEach(([l, x]) => syn.push(line(l, x)));
  syn.push(line('TOTAL ' + selLabel().toUpperCase(), tot));
  const ws0 = XLSX.utils.aoa_to_sheet(syn); ws0['!cols'] = syn[0].map((h, i) => ({wch: i ? 13 : 30}));
  XLSX.utils.book_append_sheet(wb, ws0, 'SYNTHESE ' + y);
  // 2. Tableaux mensuels par parc
  const M = [['COMMANDES', x => x.cde], ['LIVRES', x => x.liv], ['FI', x => x.fi], ['IP FI', x => x.liv.map((v, i) => ipv(x.fi[i], v))], ['MARGE', x => x.marge.map(Math.round)], ['CA FI HT', x => x.caf.map(Math.round)]];
  M.forEach(([name, f]) => {
    const aoa = [['PARC', ...MOIS.map(m => m.toUpperCase()), name === 'IP FI' ? 'ANNÉE' : 'TOTAL']];
    per.forEach(([l, x]) => { const a = f(x); aoa.push([l, ...a.slice(1), a[0]]); });
    const a = f(tot); aoa.push(['TOTAL', ...a.slice(1), a[0]]);
    const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = aoa[0].map((h, i) => ({wch: i ? 11 : 30}));
    XLSX.utils.book_append_sheet(wb, ws, name + ' PAR MOIS');
  });
  // 3. Toutes les commandes de l'année (une ligne par commande, avec le parc)
  const GC = GCOLS();
  const rows = S.rows.filter(r => sites.includes(r.site) && (ym(r.date_cde)[0] === y || ym(r.date_fact)[0] === y)).sort((a, b) => (a.site + (a.date_cde || '')).localeCompare(b.site + (b.date_cde || '')));
  const aoa = [['PARC', ...GC.map(c => c[1])]];
  rows.forEach(r => aoa.push([siteObj(r.site).label, ...GC.map(([k, , t]) => t === 'bool' ? (r[k] ? 1 : null) : t === 'date' ? (r[k] ? new Date(r[k] + 'T00:00:00') : null) : r[k])]));
  const wsc = XLSX.utils.aoa_to_sheet(aoa, {cellDates: true}); wsc['!cols'] = [{wch: 28}, ...GC.map(c => ({wpx: COLW[c[0]] + 14}))];
  XLSX.utils.book_append_sheet(wb, wsc, 'LISTE DES COMMANDES');
  XLSX.writeFile(wb, `Recap VO ${selLabel()} ${y}.xlsx`);
}
function exportRecap() {
  const site = S.sel.s, st = stats([site], S.year, S.ent), wb = XLSX.utils.book_new();
  const H = t => [t, ...MOIS, 'TOTAL'];
  const add = (name, blocks) => {
    const aoa = [];
    blocks.forEach(([t, lines]) => { aoa.push(H(t)); lines.forEach(([l, a]) => aoa.push([l, ...a.slice(1), a[0]])); aoa.push([]); });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), name);
  };
  const V = vendRows(st), vv = k => V.map(v => [v === '__NA' ? 'NON AFFECTÉ' : v, (st.v[v] || {})[k] || Array(13).fill(0)]);
  add('RECAP', [
    ['COMMANDES', [...vv('cde'), ['TOTAL', st.cde], ['OBJECTIF', st.oc]]],
    ['LIVRAISONS', [...vv('liv'), ['TOTAL', st.liv], ['OBJECTIF', st.ol]]],
    ['FI', [...vv('fi'), ['TOTAL', st.fi]]],
    ['MARGE', [...vv('marge'), ['TOTAL', st.marge], ['OBJECTIF', st.om]]],
    ['CA FI HT', [...Object.entries(st.org).map(([o, a]) => [o || 'NON RENSEIGNÉ', a]), ['TOTAL', st.caf]]],
    ['COYOTE', [...vv('coy'), ['TOTAL', st.coy]]], ['PROTECH', [...vv('pro'), ['TOTAL', st.pro]]], ['BULBEE', [...vv('bul'), ['TOTAL', st.bul]]],
    ['VENTES AM', [...vv('am'), ['TOTAL', st.am]]],
  ]);
  XLSX.writeFile(wb, `Recap VO ${siteObj(site).label} ${S.year}.xlsx`);
}

function pwdModal() {
  const d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = `<form class="pbox" id="pf"><h3>Changer mon mot de passe</h3><p class="note">C'est aussi votre mot de passe Prospection Atelier.</p>
    <label>Nouveau mot de passe (8 caractères minimum)</label><input type="password" name="p1" minlength="8" required>
    <label>Confirmer</label><input type="password" name="p2" minlength="8" required>
    <div class="row2"><button class="btn" type="submit">Enregistrer</button><button type="button" class="btn ghost" onclick="this.closest('.modal').remove()">Annuler</button><span class="dmsg" id="pm"></span></div></form>`;
  document.body.appendChild(d);
  $('#pf').onsubmit = async e => {
    e.preventDefault();
    if (e.target.p1.value !== e.target.p2.value) { $('#pm').textContent = 'Les deux mots de passe diffèrent'; return; }
